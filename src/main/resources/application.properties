spring.application.name=smaact4

# ===== Base de datos (MySQL) =====
# Usuario, password y clave JWT reales NO se escriben aqui: se leen de ./db.properties
# (archivo que NO se sube a GitHub) o de variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smaact4_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:file:./db.properties

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Paginacion =====
spring.data.web.pageable.max-page-size=50

# ===== JWT =====
# Clave para firmar los tokens (minimo 32 caracteres). La real va en db.properties.
jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-cambiar-en-db-properties-2026}
jwt.issuer=smaact4-api
jwt.expiracion-minutos=60
